name: Update UniFi Prices

on:
  schedule:
    # Runs automatically every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to manually trigger it via the Actions tab

permissions:
  contents: write # Grants the workflow permission to save data to your repo

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Price Tracker Script
        run: python get_unifi_prices.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add unifi_prices.csv
          # The conditional check prevents workflow errors if prices didn't change
          git diff-index --quiet HEAD || (git commit -m "Automated price refresh: $(date -u)" && git push)
